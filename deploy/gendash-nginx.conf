# /etc/nginx/sites-available/gendash.conf
# Proxies gendash.englishplus.com.ua -> the Next.js app on 127.0.0.1:3001.
# This REPLACES the earlier static-placeholder vhost. It includes the TLS block
# itself (pointing at the cert certbot already issued), so it is safe to install
# wholesale — unlike letting certbot own the file.

map $http_upgrade $gendash_conn_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gendash.englishplus.com.ua;
    return 301 https://$host$request_uri;
}

# HTTPS -> Next.js app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gendash.englishplus.com.ua;

    ssl_certificate     /etc/letsencrypt/live/gendash.englishplus.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gendash.englishplus.com.ua/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gendash_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
